- abstract: The rapid growth of scientific publications makes it increasingly difficult
    to track and synthesize research progress. While Large Language Models (LLMs)
    can support automated survey generation, existing methods retrieve unstructured
    data and require models to infer conceptual, methodological, and taxonomic relations
    from raw text at generation time. We introduce StructSurvey, a hierarchical multi-agent
    framework that shifts structural reasoning from generation to retrieval by dynamically
    constructing graph-based representations of entities, relations, and topical taxonomies.
    We evaluate StructSurvey on a new reference-grounded benchmark of ACL survey papers
    for reproducible long-form scientific summarization. Compared with embedding-only
    retrieval baselines, StructSurvey improves ROUGE-1 recall by +2.9 and ROUGE-2
    recall by +1.0 on average, without reducing precision. It also improves LLM-as-a-Judge
    ratings for logical structure, depth, and synthesis, showing that explicit structural
    retrieval yields surveys closer to human-written organization and reasoning.
