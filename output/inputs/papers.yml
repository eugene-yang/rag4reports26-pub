- abstract: 'We submit to both tracks of the RAG4Reports challenge with two complementary
    components: PREFNUGGET, which derives concise nugget banks from pairwise preference
    judgments between system responses, and CRUCIBLE, a nugget-first pipeline that
    uses such banks to assemble reports on a given topic. The shared nugget-level
    representation unifies our approach to report evaluation (Task A) and report generation
    (Task B).'
