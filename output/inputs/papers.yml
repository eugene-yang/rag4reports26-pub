  title: 'A Tale of Trust and Accuracy: Base vs. Instruct LLMs in RAG Systems'
- abstract: 'Retrieval-Augmented Generation (RAG) grounds language-model output in
    external knowledge, yet its application to dense technical documentation remains
    largely unexplored. Engineering software manuals pose compounding challenges:
    formulae are corrupted during PDF extraction, heterogeneous content types require
    different parsing treatment, and queries demand cross-document synthesis across
    multiple reference volumes.

    We present an end-to-end RAG system for OpenFOAM, an open-source computational
    fluid dynamics toolkit, operating in two modes. In single-query mode, a formula-preserving
    parser (Marker), adaptive header-aware chunking, two-stage dense-then-rerank retrieval,
    and a citation-enforcement prompt produce grounded, source-attributed answers
    across a 20-question benchmark.

    In report mode, a user prompt is decomposed into sub-questions via LLM planning;
    each sub-question undergoes independent retrieval and cross-encoder re-ranking,
    and the deduplicated chunk set is passed to a long-context generation call that
    produces a structured, multi-section report with inline citations.

    Evaluated on a 10-prompt golden set with a six-dimension LLM-as-a-judge framework,
    both pipelines achieve overall scores above 4.6/5.0 with perfect citation correctness
    (5.0/5.0). The decomposed pipeline demonstrates superior robustness (90% vs 70%
    judge success rate). Retrieval analysis using page-level ground truth reveals
    low absolute recall (<14%), identifying retrieval breadth as the primary bottleneck.'
