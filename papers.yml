- id: 15
  title: 'Adapting AutoARGUE for Automatic Report Evaluation under Missing Citation
    Annotations'
  abstract: 'We adapt the AutoARGUE framework (Walden et al., 2026) for Task A.2
    of RAG4Reports 2026, which requires ranking 57 report generation systems across
    68 topics using automated evaluation. The RAGTIME-1 corpus poses a fundamental
    challenge: all nugget annotations use a no-reference-doc sentinel rather than
    ground-truth document citations, rendering the original citation-relevance gating
    inoperable. We address this with three adaptations: automatic sentinel detection
    with forced direct LLM-based nugget matching; a WEAK POSITIVE partial credit
    mechanism for sentences that correctly answer nuggets but lack attesting citations;
    and a report-level request alignment check. Our nugget_coverage_weighted metric
    achieves the highest topic-level Pearson correlation (r=0.599) of any non-coordinator
    submission, closely approaching the coordinator baseline (r=0.607).'
