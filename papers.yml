- id: 6
  title: 'REFSafE: A RAG-Enabled Framework for Predictive Risk Analysis and Automated
    Safety Report Generation in Mission-Critical Environments'
  abstract: 'Operational safety in mission-critical environments requires AI systems
    that are accurate, interpretable, and resistant to hallucination. We present an
    agentic Retrieval-Augmented Generation (RAG) framework, REFSafe, for grounded
    hazard analysis and automated safety report generation. The system integrates
    Large Language Models (LLMs) with structured operational data, historical incident
    repositories, policy documents, and external authoritative sources. Through iterative
    agentic reasoning, the framework retrieves, verifies, and synthesizes evidence
    prior to generation, enforcing citation-backed outputs with explicit source attribution
    (documents, links, and prior events) to ensure traceability and trust.

    To mitigate hallucinations and unsupported claims, all risk assessments and forecasts
    are constrained to retrieved evidence, with confidence signals derived from retrieval
    relevance and source consistency. A transparent pipeline enables subject matter
    experts (SMEs) to validate predictions, and provide structured feedback, forming
    a continuous performance calibration loop. Preliminary deployment demonstrates
    improved reliability in hazard detection and safety/vulnerability report generation.
    This work advances trustworthy, evidence-grounded AI for predictive safety intelligence
    in mission-critical operations.'
