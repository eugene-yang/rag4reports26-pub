- id: 14
  title: 'EFSG: Evidence-First Structured Generation for Multilingual RAG Report
    Generation'
  abstract: 'We describe EFSG (Evidence-First Structured Generation), our submission
    to Task B of the RAG4Reports@ACL 2026 shared task. Standard retrieval-augmented
    generation pipelines allow generation models to write from parametric memory
    and attach citations retroactively: a behaviour we term post-rationalization.
    EFSG addresses this structurally through a phase boundary: all evidence is retrieved,
    extracted, and sealed into a fact pool before any generation begins; each sentence
    then sees only its single committed source passage. Our best run (t5100k doc
    corpus) achieved sentence_support of 0.612 and nugget_coverage of 0.126 (F1
    = 0.182).'
