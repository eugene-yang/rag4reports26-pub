- id: 12
  title: 'AMU at RAG4Reports 2026 Task B: A Practical Multilingual RAG Pipeline
    for Citation-Grounded Reports'
  abstract: 'This system paper presents AMU''s submission to RAG4Reports 2026 Task
    B: a practical multilingual retrieval-augmented generation pipeline for evidence-supported
    report generation. The system combines full-query retrieval, optional query rewriting,
    dense retrieval with Qdrant, cross-encoder reranking, diversity-aware context
    selection, and structured generation. The best submitted run uses BAAI/bge-m3
    embeddings, BAAI/bge-reranker-v2-m3 reranking, and gpt-5.1 generation with medium
    reasoning effort, using a partial-coverage prompt strategy. On the official leaderboard,
    it achieved F1=0.4351, sentence_support=0.8280, and nugget_coverage=0.3403, indicating
    that the generated reports were well grounded but only partially comprehensive.'
