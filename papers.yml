- id: 9
  title: 'UNH @ Rag4Reports: A Broad Exploration of LLM-Judges for RAG'
  abstract: 'We submitted a breadth of LLM-as-a-Judge approaches to Rag4Reports
    Task A; our top method ranked first among all submitted systems. We find that
    citation faithfulness is the most essential signal, and that content is best verified
    by checking whether cited documents cover nuggets generated from the LLM''s internal
    knowledge.'
